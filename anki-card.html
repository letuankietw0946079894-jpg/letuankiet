// Safe audio tone generator
function playAudioTone(freq, type, duration) {
  if (!sfxEnabled) return;
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    var ctx = new AudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq || 440;
    gain.gain.value = 0.1;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    setTimeout(function() {
      try {
        osc.stop();
        ctx.close();
      } catch(e) {}
    }, (duration || 0.15) * 1000);
  } catch(e) {}
}

// Global Toast
function showToast(msg, isSuccess) {
  try {
    var toast = document.getElementById('ankiToastBox');
    if (!toast) return;
    toast.innerHTML = (isSuccess ? '✅ ' : 'ℹ️ ') + msg;
    toast.style.borderColor = isSuccess ? '#22c55e' : '#a855f7';
    toast.style.color = isSuccess ? '#4ade80' : '#a855f7';
    toast.style.display = 'block';
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function() {
      toast.style.display = 'none';
    }, 2600);
  } catch(e) {}
}
window.showToast = showToast;

// TTS Speech Synthesis
function speakText(text, event) {
  if (event &amp;&amp; event.stopPropagation) event.stopPropagation();
  if (!text) return;
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      var speedSelect = document.getElementById('audioSpeedSelect');
      if (speedSelect) u.rate = parseFloat(speedSelect.value) || 1.0;
      window.speechSynthesis.speak(u);
    } else {
      showToast('Trình duyệt Anki chưa hỗ trợ Text-to-speech', false);
    }
  } catch(e) {
    console.warn(e);
  }
}
window.speakText = speakText;

  try {

function switchMode(m, event) {
  if (event &amp;&amp; event.stopPropagation) event.stopPropagation();
  currentMode = m;
  window.currentMode = m;
  try {
    var b1 = document.getElementById('btnMode1');

    var btns = [b1, b2, b3];

    if (m === 1 &amp;&amp; b1) {

    } else if (m === 2 &amp;&amp; b2) {
      b2.style.backgroundColor = '#a855f7';
      b2.style.color = '#000000';

    var mode1s = document.querySelectorAll('.card-mode-1');

    var mode3s = document.querySelectorAll('.card-mode-3');

    for (var k = 0; k < mode1s.length; k++) mode1s[k].style.display = (m === 1 ? 'flex' : 'none');
    for (var l = 0; l < mode2s.length; l++) mode2s[l].style.display = (m === 2 ? 'flex' : 'none');
    for (var n = 0; n < mode3s.length; n++) mode3s[n].style.display = (m === 3 ? 'flex' : 'none');

    // Update pills on all cards
    for (var c = 0; c < lessonsData.length; c++) {
      var p1 = document.querySelector('.pill-m1-' + c);

function evaluateWithGemini(idx, event) {
  if (event &amp;&amp; event.stopPropagation) event.stopPropagation();
  var textarea = document.getElementById('textarea-ai-' + idx);
  var box = document.getElementById('ai-feedback-box-' + idx);
  if (!textarea || !box) return;

  var text = (textarea.value || '').trim();
  if (!text) {
    showToast('Vui lòng nhập câu để AI đánh giá', false);
    return;
  }

  box.style.display = 'block';
  box.innerHTML = '<div style=&quot;display:flex; align-items:center; gap:8px;&quot;><span style=&quot;font-size:16px;&quot;>⏳</span> <span>Đang kết nối Gemini AI để phân tích ngữ pháp...</span></div>';

  var item = lessonsData[idx];
  var isTrans = item ? item.isTransitive : false;
  var apiKey = '';
  try {
    apiKey = localStorage.getItem('anki_gemini_key') || '';
  } catch(e) {}

  if (apiKey) {
    // Call Gemini REST API
      var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=' + apiKey;
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: 'Bạn là chuyên gia ngữ pháp JLPT N4/N5. Hãy chấm điểm và phân tích câu sau về: 1. Thể sai khiến (使役動詞); 2. Lựa chọn trợ từ に hay を; 3. Sắc thái biểu đạt bằng tiếng Việt súc tích, dễ hiểu: &quot;' + text + '&quot;'
          }]
        }]
      })
    })
    .then(function(res) { return res.json().then(function(d){ return { ok: res.ok, status: res.status, data: d }; }); })
    .then(function(r) {
      var data = r.data || {};
      if (data.error) {
        box.innerHTML = '<div style=&quot;color:#fca5a5; font-weight:700;&quot;>⚠️ Lỗi Gemini (' + (data.error.code || r.status) + '): ' + (data.error.message || 'Không rõ nguyên nhân') + '</div><div style=&quot;margin-top:6px; color:#9f88be;&quot;>Kiểm tra lại API Key (nút 🔑 Key AI) hoặc thử lại. Tạm dùng trợ lý phân tích ngoại tuyến bên dưới:</div>';
        var sub1 = document.createElement('div'); sub1.style.marginTop = '8px'; box.appendChild(sub1);
        renderSimulatedAi(sub1, text, isTrans);
        return;
      }
      var reply = '';
      if (data.candidates) { if (data.candidates[0]) { if (data.candidates[0].content) { if (data.candidates[0].content.parts) { if (data.candidates[0].content.parts[0]) { reply = data.candidates[0].content.parts[0].text || ''; } } } } }
      if (!reply) { renderSimulatedAi(box, text, isTrans); return; }
      renderAiResponse(box, reply);
      userXp += 20;
      updateGamifyStats();
      playAudioTone(880, 'sine', 0.2);
    })
    .catch(function(err) {
      box.innerHTML = '<div style=&quot;color:#fca5a5; font-weight:700;&quot;>⚠️ Không kết nối được Gemini: ' + (err ? (err.message || err) : 'lỗi mạng') + '</div><div style=&quot;margin-top:6px; color:#9f88be;&quot;>Có thể do mạng hoặc Anki chặn kết nối. Dùng trợ lý phân tích ngoại tuyến:</div>';
      var sub2 = document.createElement('div'); sub2.style.marginTop = '8px'; box.appendChild(sub2);
      renderSimulatedAi(sub2, text, isTrans);
    });
  } else {
    // Intelligent rules-based offline AI Analysis
    setTimeout(function() {
      renderSimulatedAi(box, text, isTrans);
      userXp += 20;
      updateGamifyStats();
      playAudioTone(880, 'sine', 0.2);
    }, 400);
  }
}

function skHexToRgb(hex) {
  var h = (hex || '').replace('#', '').trim();
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h, 16);
  if (isNaN(n)) return '';
  return ((n >> 16) &amp; 255) + ', ' + ((n >> 8) &amp; 255) + ', ' + (n &amp; 255);
}
function skRegexEscape(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&amp;'); }
function applyGlobalThemeColors(fromId, toId) {
  var from = THEME_PRESETS[fromId], to = THEME_PRESETS[toId];
  if (!from || !to || fromId === toId) return;
  var slots = ['bgMain','bgCard','border','accent','accentHover','textMain','textMuted','highlight'];
  var map = {}, keys = [];
  for (var i = 0; i < slots.length; i++) {
    var f = (from[slots[i]] || '').toLowerCase();
    if (!f) continue;
    if (map[f] === undefined) { map[f] = to[slots[i]]; keys.push(f); }
  }
  if (!keys.length) return;
  keys.sort(function(a, b) { return b.length - a.length; });
  var hexRe = new RegExp(keys.map(skRegexEscape).join('|'), 'gi');
  var fromRgb = skHexToRgb(from.accent), toRgb = skHexToRgb(to.accent);
  var rgbRe = fromRgb ? new RegExp(fromRgb.replace(/,\s*/g, ',\\s*'), 'g') : null;
  function conv(str) {
    if (!str) return str;
    var out = str.replace(hexRe, function(m) { var k = m.toLowerCase(); return map[k] !== undefined ? map[k] : m; });
    if (rgbRe &amp;&amp; fromRgb !== toRgb) out = out.replace(rgbRe, toRgb);
    return out;
  }
  var root = document.getElementById('anki-speedrun-container');
  if (!root) return;
  var nodes = [root];
  var styled = root.querySelectorAll('[style]');
  for (var s = 0; s < styled.length; s++) nodes.push(styled[s]);
  if (document.body) nodes.push(document.body);
  for (var n = 0; n < nodes.length; n++) {
    var el = nodes[n];
    if (!el || !el.getAttribute || el.tagName === 'OPTION') continue;
    var sv = el.getAttribute('style');
    if (sv) { var nv = conv(sv); if (nv !== sv) el.setAttribute('style', nv); }
  }
  var styleTags = document.querySelectorAll('style');
  for (var st = 0; st < styleTags.length; st++) {
    var tag = styleTags[st];
    var tx = tag.textContent || '';
    var nx = conv(tx);
    if (nx !== tx) tag.textContent = nx;
  }
}

// 3-TIER BULLETPROOF CLICK SYSTEM
// Tier 1: Capture Phase Event Delegation on document
// --------------------------------------------------------------------------
function handleGlobalAnkiClick(e) {
  var el = e.target;
  while (el &amp;&amp; el !== document &amp;&amp; el !== window) {
    if (el.getAttribute &amp;&amp; el.getAttribute('data-action')) break;
    if (el.tagName === 'BUTTON') break;
    el = el.parentElement;
  }
  if (!el || el === document || el === window) return;

  var action = el.getAttribute('data-action');
  if (!action) return;

  if (e.stopPropagation) e.stopPropagation();

  if (action === 'switch-mode') {
    var m = parseInt(el.getAttribute('data-mode') || '1', 10);
    switchMode(m, e);
  } else if (action === 'select-card') {
    var idx = parseInt(el.getAttribute('data-index') || '0', 10);
    selectCard(idx, e);
  } else if (action === 'check-mode1') {
    var idx = parseInt(el.getAttribute('data-index') || '0', 10);
    checkMode1(idx, e);
  } else if (action === 'check-mode2') {
    var idx = parseInt(el.getAttribute('data-index') || '0', 10);
    var p = el.getAttribute('data-particle') || 'に';
    checkMode2(idx, p, e);
  } else if (action === 'evaluate-ai') {
    var idx = parseInt(el.getAttribute('data-index') || '0', 10);
    evaluateWithGemini(idx, e);
  } else if (action === 'toggle-answer') {
    var idx = parseInt(el.getAttribute('data-index') || '0', 10);
    toggleCardAnswer(idx, e);
  } else if (action === 'toggle-all-answers') {
    toggleShowAllAnswers(e);
  } else if (action === 'reset-practice') {
    resetPracticeState(e);
  } else if (action === 'toggle-recall') {
    toggleActiveRecall(e);
  } else if (action === 'play-current-audio') {
    playAudioCurrentBanner(e);
  } else if (action === 'speak-text') {
    var txt = el.getAttribute('data-text') || '';
    speakText(txt, e);
  } else if (action === 'open-modal') {
    var mId = el.getAttribute('data-modal') || '';
    openModal(mId, e);
  } else if (action === 'close-modal') {
    var mId = el.getAttribute('data-modal') || '';
    closeModal(mId, e);
  } else if (action === 'open-lightbox') {
    var idx = parseInt(el.getAttribute('data-index') || '0', 10);
    openLightboxModal(idx, e);
  } else if (action === 'toggle-sfx') {
    toggleAudioMute(e);
  } else if (action === 'switch-flow') {
    var flow = el.getAttribute('data-flow') || 'intransitive';
    switchFlowchart(flow, e);
  } else if (action === 'check-verb') {
    var vId = parseInt(el.getAttribute('data-verb-id') || '1', 10);
    checkVerbRow(vId, e);
  } else if (action === 'save-ai-key') {
    saveGeminiApiKey(e);
  }
}

// Clean up existing document listeners from prior reviews to prevent memory leak
if (window._anki_speedrun_clickHandler) {
  try { document.removeEventListener('click', window._anki_speedrun_clickHandler, true); } catch(err) {}
}
window._anki_speedrun_clickHandler = handleGlobalAnkiClick;
try {

} catch(err) {}

function handleGlobalAnkiKeydown(e) {
  var root = document.getElementById('anki-speedrun-container');
  if (!root) return;

  var tag = (e.target &amp;&amp; e.target.tagName) ? e.target.tagName.toLowerCase() : '';
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

  if (e.key === 'Escape') {
    closeModal('shortcutsModal');
    closeModal('lightboxModal');
    closeModal('aiKeyModal');
  } else if (e.key.toLowerCase() === 'r' || e.key.toLowerCase() === 'p') {
    // Audio replay shortcut without capturing Space (Space is reserved for Anki flip/grade)
    playAudioCurrentBanner();
  } else if (e.key === '1') {
    checkMode2(currentCardIndex, 'に');

    selectCard((currentCardIndex + 1) % lessonsData.length);
  } else if (e.key.toLowerCase() === 'k') {
    selectCard((currentCardIndex - 1 + lessonsData.length) % lessonsData.length);
  } else if (e.key.toLowerCase() === 'z') {
    openLightboxModal(currentCardIndex);
  } else if (e.key.toLowerCase() === 'h' || e.key.toLowerCase() === 'a') {
    toggleCardAnswer(currentCardIndex);
  }
}

if (window._anki_speedrun_keydownHandler) {
  try { document.removeEventListener('keydown', window._anki_speedrun_keydownHandler); } catch(err) {}
}
window._anki_speedrun_keydownHandler = handleGlobalAnkiKeydown;
try {

// Tier 2: Initialization routine (sets up images, state &amp; selects active card)

  } catch(e) {
    console.error('initAnkiSpeedrun error:', e);
  }
}
window.initAnkiSpeedrun = initAnkiSpeedrun;

// Run initialization immediately &amp; with safety timers
initAnkiSpeedrun();
setTimeout(initAnkiSpeedrun, 40);
setTimeout(initAnkiSpeedrun, 200);
})();

        body: JSON.stringify({ contents: [{ parts: [{ text: 'Bạn là giáo viên tiếng Nhật JLPT. Hãy chấm và phân tích ngắn gọn bằng tiếng Việt câu sau về: thể sai khiến 使役, lựa chọn trợ từ に/を, và sắc thái. Nếu sai hãy sửa lại câu đúng. Câu: &quot;' + sentence + '&quot;' }] }] })
      })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var reply = d.candidates &amp;&amp; d.candidates[0] &amp;&amp; d.candidates[0].content &amp;&amp; d.candidates[0].content.parts &amp;&amp; d.candidates[0].content.parts[0] ? d.candidates[0].content.parts[0].text : '';
        if (reply) done(reply); else offline();
      })
      .catch(function(){ offline(); });
    } else {
      setTimeout(offline, 350);
    }
  }
  window.skUniAiEval = uniAiEval;

  // ---------- parse exercises from field Data ----------
  function parseExercises(raw){
    var out = [], pendingHint = '';
    var ls = toLines(raw);
    for (var i = 0; i < ls.length; i++) {
      var rawLine = ls[i];
      var img = findImage(rawLine);
      var text = stripTags(rawLine.replace(/<img[^>]*>/gi, ' ').replace(/\[img:[^\]]+\]/gi, ' '));
      if (img &amp;&amp; text.indexOf(img) !== -1) text = text.replace(img, '').trim();
      if (!text &amp;&amp; !img) continue;
      if (!hasBlank(text)) {
        if (text) pendingHint = text;
        if (img &amp;&amp; out.length &amp;&amp; !out[out.length - 1].image) out[out.length - 1].image = img;
        continue;
      }
      var note = '';
      var mNote = text.split(/\s*\/\/\s*/);
      if (mNote.length > 1) { text = mNote[0]; note = mNote.slice(1).join(' // '); }
      var answers = [];
      var parts = text.split(/\s*(?:=|＝|➔|=>|⇒|\|\|)\s*/);
      if (parts.length > 1) {
        text = parts[0].trim();
        answers = parts.slice(1).join(' ').split(/\s*[\/;,、･・|]\s*/).filter(function(x){ return !!x.trim(); });
      }
      out.push({ q: text.trim(), answers: answers, hint: pendingHint, note: note, image: img });
      pendingHint = '';
    }
    return out;
  }

  // ---------- parse conjugation rows from field Notes ----------
  function parseVerbs(raw){
    var out = [];
    var ls = toLines(raw);
    for (var i = 0; i < ls.length; i++) {
      var t = stripTags(ls[i]);
      if (!t) continue;
      var p = t.split(/\s*(?:=|＝|➔|=>|⇒|\||\t|:)\s*/);
      if (p.length < 2) continue;
      var group = '';
      var gm = p[0].match(/^\s*\[?\s*(?:nh[oó]m|group|G)\s*([123])\s*\]?\s*[-.:]?\s*/i);
      var base = p[0];
      if (gm) { group = gm[1]; base = p[0].replace(gm[0], ''); }
      out.push({ group: group, base: base.trim(), answer: p.slice(1).join(' ').trim() });
    }
    return out;
  }

  // ---------- render ----------

        +     '<button type=&quot;button&quot; data-uni=&quot;speak&quot; data-ex=&quot;' + i + '&quot; style=&quot;background:var(--bg-main, #110a1d);border:1px solid var(--border, #581c87);color:' + A + ';padding:4px 8px;border-radius:8px;font-size:11px;cursor:pointer;&quot;>🔊</button>'
        +     '<button type=&quot;button&quot; data-uni=&quot;check&quot; data-ex=&quot;' + i + '&quot; style=&quot;background:' + A + ';border:none;color:#000;font-weight:800;padding:5px 12px;border-radius:8px;font-size:11.5px;cursor:pointer;&quot;>✓ Kiểm tra</button>'
        +     '<button type=&quot;button&quot; data-uni=&quot;ai&quot; data-ex=&quot;' + i + '&quot; style=&quot;background:var(--bg-main, #110a1d);border:1px solid ' + A + ';color:' + A + ';padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;&quot;>🤖 Chấm AI</button>'
        +     '<button type=&quot;button&quot; data-uni=&quot;reveal&quot; data-ex=&quot;' + i + '&quot; style=&quot;background:var(--bg-main, #110a1d);border:1px solid var(--border, #581c87);color:var(--text-main, #f3e8ff);padding:5px 10px;border-radius:8px;font-size:11.5px;cursor:pointer;&quot;>💡 Đáp án</button>'

        + (it.image ? '<div class=&quot;sk-uni-img&quot; data-uni=&quot;pick-img&quot; data-ex=&quot;' + i + '&quot; title=&quot;Bấm để xem ảnh này ở khung lớn&quot; style=&quot;width:100%;height:190px;background:#000;cursor:pointer;position:relative;&quot;><img src=&quot;' + it.image + '&quot; alt=&quot;&quot;><span style=&quot;position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,0.55);padding:2px 8px;border-radius:6px;&quot;>🔍 Bấm để phóng lên khung lớn</span></div>' : '')
        + '<div style=&quot;font-size:13.5px;font-weight:700;color:var(--text-main, #f3e8ff);font-family:\'Noto Serif JP\',serif;line-height:2.2;display:flex;flex-wrap:wrap;align-items:center;gap:2px;&quot;>' + body + '</div>'
        + '<div class=&quot;sk-uni-ai&quot; id=&quot;sk-uni-ai-' + i + '&quot; style=&quot;display:none;background:var(--highlight, #2b1947);border:1px solid ' + A + ';border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.6;&quot;></div>'
        + '<div class=&quot;sk-uni-ans&quot; data-ex=&quot;' + i + '&quot; style=&quot;display:none;background:var(--highlight, #2b1947);border:1px solid var(--border, #581c87);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.6;&quot;>'
        +   '<strong style=&quot;color:' + A + ';&quot;>✨ Đáp án:</strong> <span style=&quot;font-family:\'Noto Serif JP\',serif;font-weight:700;&quot;>' + esc(it.answers.join(' / ') || '(chưa nhập đáp án trong Data)') + '</span>'

      if (!it) return;
      if (act === 'pick-img') {
        if (it.image) { setMainImage(it.image, idx); }
      } else if (act === 'ai') {
        uniAiEval(idx, it);
      } else if (act === 'reveal') {

        var full = it.q;
        for (var m = 0; m < it.answers.length; m++) full = full.replace(/_{2,}/, it.answers[m]);
        try {
          var u = new SpeechSynthesisUtterance(full.replace(/_{2,}/g, ''));
          u.lang = 'ja-JP';
          window.speechSynthesis.cancel();

             +  '<div style=&quot;width:100%;height:56px;border-radius:10px;overflow:hidden;background:#000;&quot;><img src=&quot;' + items[g].image + '&quot; alt=&quot;&quot; style=&quot;width:100%;height:100%;object-fit:cover;display:block;&quot;></div>'

  function renderVerbs(rows){
    var body = document.getElementById('verbTableBody');
    var sec = document.getElementById('verbDrillSection');
    if (!body || !sec) return;
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      h += '<tr style=&quot;border-bottom:1px solid rgba(255,255,255,0.06);&quot;>'
        +  '<td style=&quot;text-align:center;padding:7px 8px;color:#9f88be;font-size:11px;&quot;>' + (rows[i].group ? 'Nhóm ' + rows[i].group : '—') + '</td>'
        +  '<td style=&quot;text-align:center;padding:7px 8px;font-family:\'Noto Serif JP\',serif;font-weight:700;color:#f3e8ff;&quot;>' + esc(rows[i].base) + '</td>'
        +  '<td style=&quot;text-align:center;padding:7px 8px;color:#9f88be;&quot;>—</td>'
        +  '<td style=&quot;padding:7px 8px;&quot;><input class=&quot;sk-blank-input sk-uni-verb&quot; data-row=&quot;' + i + '&quot; type=&quot;text&quot; autocomplete=&quot;off&quot; placeholder=&quot;viết...&quot; style=&quot;width:100%;text-align:left;&quot;></td>'
        +  '<td style=&quot;text-align:center;padding:7px 8px;&quot;><button type=&quot;button&quot; data-uni-verb=&quot;' + i + '&quot; style=&quot;background:' + A + ';border:none;color:#000;font-weight:800;padding:4px 10px;border-radius:8px;font-size:11px;cursor:pointer;&quot;>✓</button></td>'
        + '</tr>';
    }
    body.innerHTML = h;
    sec.style.display = 'block';
    function checkRow(i){
      var inp = body.querySelector('.sk-uni-verb[data-row=&quot;' + i + '&quot;]');
      if (!inp) return;
      var ok = norm(inp.value) === norm(rows[i].answer);
      inp.className = 'sk-blank-input sk-uni-verb ' + (ok ? 'sk-blank-ok' : 'sk-blank-bad');
      if (!ok) inp.value = inp.value;
      if (typeof window.showToast === 'function') window.showToast(ok ? '🎉 Đúng: ' + rows[i].answer : '❌ Đáp án: ' + rows[i].answer, ok);
    }
    body.addEventListener('click', function(e){
      var t = e.target;
      while (t &amp;&amp; t !== body &amp;&amp; !(t.getAttribute &amp;&amp; t.getAttribute('data-uni-verb'))) t = t.parentElement;
      if (!t || t === body) return;
      checkRow(parseInt(t.getAttribute('data-uni-verb'), 10));
    }, false);
    body.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;
      var t = e.target;
      if (t &amp;&amp; t.getAttribute &amp;&amp; t.getAttribute('data-row') !== null) checkRow(parseInt(t.getAttribute('data-row'), 10));
    }, false);
  }

  function boot(){
    var dataRaw = grab('anki-f-data');
    var notesRaw = grab('anki-f-notes');
    var title = stripTags(grab('anki-f-title'));
    var level = stripTags(grab('anki-f-level'));
    if (!dataRaw &amp;&amp; !notesRaw) return; // khong co Data -> giu nguyen bai mau
    if (window._anki_universal_done) return;
    window._anki_universal_done = true;

    var items = parseExercises(dataRaw);
    var verbs = parseVerbs(notesRaw);

    if (items.length) {
      renderExercises(items);
      var firstImg = '';
      for (var q = 0; q < items.length; q++) { if (items[q].image) { firstImg = items[q].image; break; } }
      window._anki_universal_statics = {
        banner: (title || 'BÀI TẬP ĐIỀN LỖ') + (level ? ' · ' + level : ''),
        image: firstImg,
        imgTitle: firstImg ? ('HÌNH ẢNH MINH HỌA' + (title ? ': ' + title : '')) : ''
      };
      keepStatics();
    } else {
      hide('mainSituationContainer');
      hide('mangaStripSection');
      var ec = document.getElementById('exerciseCardsContainer');
      if (ec) ec.style.display = 'none';
    }

    if (verbs.length) { renderVerbs(verbs); } else { hide('verbDrillSection'); }
  }

  function keepStatics(){
    try {
      var st = window._anki_universal_statics;
      if (!st) return;
      var banner = document.getElementById('targetBannerText');
      if (banner &amp;&amp; st.banner) banner.innerText = st.banner;
      var mt = document.getElementById('mainSituationTitle');
      if (mt) mt.innerText = st.imgTitle || '';
      var mi = document.getElementById('mainSituationImage');
      if (mi &amp;&amp; st.image) mi.src = st.image;
      var mc = document.getElementById('mainSituationContainer');
      if (mc) mc.style.display = st.image ? 'block' : 'none';
    } catch(e) {}
  }
  try { boot(); } catch(e) { console.error('universal engine:', e); }
  var ticks = 0;
  var iv = setInterval(function(){
    ticks++;
    try { boot(); } catch(e) {}
    keepStatics();
    if (ticks > 14) clearInterval(iv);
  }, 150);
})();
</script>

<script id=&quot;sk-mode1-mask-script&quot;>
(function(){
  // Che đáp án ở bài Điền thể sai khiến (Mode 1): thay động từ sai khiến ở
  // đuôi câu bằng ô đục lỗ, thay vì hiện nguyên câu (lộ đáp án).
  function skMaskMode1(){
    try{
      var data = window.lessonsData || [];
      for(var i=0;i<data.length;i++){
        var item = data[i];
        if(!item) continue;
        var box = document.getElementById('card-mode-1-'+i);
        if(!box) continue;
        var sent = box.querySelector('div');
        if(!sent) continue;
        if(sent.getAttribute('data-sk-masked') === '1') continue;
        var cz = item.clozenes || [];
        var verb = cz.length ? cz[cz.length-1] : '';
        var full = item.fullSentence || '';
        var masked = full;
        if(verb){
          var idx = full.lastIndexOf(verb);
          if(idx !== -1){
            masked = full.slice(0, idx) + '<span class=&quot;sk-blank-fill&quot;>［ ？ ］</span>';
          }
        }
        sent.innerHTML = masked;
        sent.setAttribute('data-sk-masked','1');
      }
    }catch(e){}
  }
  window.skMaskMode1 = skMaskMode1;
  var n = 0;
  var iv = setInterval(function(){ n++; skMaskMode1(); if(n>25) clearInterval(iv); }, 200);
  try { document.addEventListener('DOMContentLoaded', skMaskMode1, false); } catch(e) {}
})();
</script>

<script id=&quot;sk-final-fixes&quot;>
(function(){
  function $(id){ return document.getElementById(id); }

  /* ---- CSS bo sung: full man hinh + o duc lo tro tu + luoi nhom ---- */
  function skInjectCss(){
    if($('sk-final-fixes-css')) return;
    var s = document.createElement('style');
    s.id = 'sk-final-fixes-css';
    s.textContent =
      'html,body{min-height:100vh;min-height:100dvh;}' +
      '#anki-speedrun-container{min-height:100vh;min-height:100dvh;}' +
      '#anki-main-layout{align-items:stretch;}' +
      '.sk-part-blank{width:52px;text-align:center;background:rgba(0,0,0,0.35);border:none;border-bottom:2px dashed var(--accent,#a855f7);border-radius:7px 7px 0 0;color:var(--accent-hover,#c084fc);font-weight:800;font-family:Noto Serif JP,serif;font-size:13px;outline:none;padding:3px 4px;}' +
      '.sk-part-blank:focus{border-bottom-color:var(--accent-hover,#c084fc);box-shadow:0 6px 16px -10px var(--glow,rgba(168,85,247,0.6));}' +
      '.sk-part-ok{border-bottom-color:#22c55e !important;color:#4ade80 !important;}' +
      '.sk-part-bad{border-bottom-color:#ef4444 !important;color:#fca5a5 !important;}' +
      '.sk-verb-card{background:var(--bg-main,#110a1d);border:1px solid var(--border,#581c87);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 16px -12px rgba(0,0,0,0.8);}' +
      '.sk-verb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}' +
      '@media (max-width:620px){.sk-verb-grid{grid-template-columns:1fr;}}' +
      '#advGrammarBox{display:block !important;}';
    (document.head || document.documentElement).appendChild(s);
  }

  /* ---- 1) Full man hinh moi thiet bi ---- */
  function skFullscreen(){
    var c = $('anki-speedrun-container');
    if(c){ c.style.minHeight = '100dvh'; }
    if(document.body){ document.body.style.minHeight = '100dvh'; }
  }

  /* ---- 2) Doi mau theo cap do N5..N1 nhap o truong {{Cap do}} ---- */
  function skReadLevel(){
    var docs = [];
    try{ docs.push(document); }catch(e){}
    try{ if(window.parent &amp;&amp; window.parent!==window) docs.push(window.parent.document); }catch(e){}
    try{ if(window.top &amp;&amp; window.top!==window) docs.push(window.top.document); }catch(e){}
    for(var i=0;i<docs.length;i++){
      try{
        var el = docs[i].getElementById('anki-f-level');
        if(el){ var h = (el.textContent||''); if(h &amp;&amp; h.indexOf('{{')===-1) return h; }
      }catch(e){}
    }
    return '';
  }
  var _skLevelDone = false;
  function skLevelTheme(){
    if(_skLevelDone) return;
    try{
      var raw = (skReadLevel()||'').toUpperCase();
      if(!raw) return;
      var order = ['N5','N4','N3','N2','N1'];
      var themeOf = { 'N5':'theme-n5','N4':'theme-n4','N3':'theme-n3','N2':'theme-n2','N1':'theme-n1' };
      var pick = '';
      for(var i=0;i<order.length;i++){ if(raw.indexOf(order[i])!==-1){ pick = themeOf[order[i]]; break; } }
      if(pick &amp;&amp; typeof window.switchExportTheme==='function'){
        _skLevelDone = true;
        if(pick !== (window._appliedThemeId||'theme-n1')) window.switchExportTheme(pick);
      }
    }catch(e){}
  }

  /* ---- 3) Khung ngu phap lien quan nang cao: luon hien, mo san ---- */
  function skShowAdvGrammar(){
    var b = $('advGrammarBox');
    if(b){ b.style.display = 'block'; try{ b.open = true; }catch(e){} }
  }

  /* ---- 4) Rebuild bang 20 dong tu -> luoi theo nhom, tu chia cot,
            tro tu thanh o duc lo, hien ca dap an chia the ---- */
  var _skGridBuilt = false;
  var _skVerbReveal = false;
  function skGroupLabel(name){
    if(/1/.test(name)) return name + ' (五段)';
    if(/2/.test(name)) return name + ' (一段)';
    if(/3/.test(name)) return name + ' (Bất quy tắc)';
    return name;
  }
  function skCheckVerb(id){
    var p = $('verb-particle-' + id);
    if(p){
      var pv = (p.value||'').trim();
      var pe = (p.getAttribute('data-expected')||'').trim();
      var okp = (pv === pe);
      p.className = 'sk-part-blank ' + (okp ? 'sk-part-ok' : 'sk-part-bad');
    }
    if(typeof window.checkVerbRow === 'function'){ try{ window.checkVerbRow(id); }catch(e){} }
    var fa = $('verb-fullans-' + id);
    if(fa) fa.style.display = 'block';
  }
  window.skCheckVerb = skCheckVerb;

  function skBuildVerbGrid(){
    if(_skGridBuilt) return;
    var body = $('verbTableBody');
    var sec = $('verbDrillSection');
    if(!body || !sec) return;
    var rows = body.querySelectorAll('tr[id^=&quot;verb-row-&quot;]');
    if(!rows.length) rows = body.getElementsByTagName('tr');
    if(!rows.length) return;

    var order = [];
    var gmap = {};
    for(var i=0;i<rows.length;i++){
      var r = rows[i];
      var tds = r.getElementsByTagName('td');
      if(tds.length < 4) continue;
      var idm = (r.id && r.id.match(/verb-row-(\d+)/)) ? r.id.match(/verb-row-(\d+)/)[1] : String(i+1);
      var grp = ((tds[0].textContent||'').replace(/\s+/g,' ').trim()) || 'Khác';
      var baseHtml = tds[1].innerHTML;
      var partSpan = tds[2].querySelector('span');
      var particle = partSpan ? (partSpan.textContent||'').replace(/\s+/g,'').trim() : '';
      var inp = r.querySelector('input');
      var expected = inp ? (inp.getAttribute('data-expected')||'') : '';
      var ph = inp ? (inp.getAttribute('placeholder')||'') : '';
      if(!gmap[grp]){ gmap[grp] = { name: grp, items: [] }; order.push(grp); }
      gmap[grp].items.push({ id: idm, baseHtml: baseHtml, particle: particle, expected: expected, ph: ph });
    }
    if(!order.length) return;

    var html = '';
    for(var g=0; g<order.length; g++){
      var grpObj = gmap[order[g]];
      html += '<div style=&quot;margin-bottom:14px;&quot;>';
      html += '<div style=&quot;font-size:12px;font-weight:800;color:var(--accent,#a855f7);margin:0 0 8px;padding:5px 12px;background:rgba(168,85,247,0.12);border-left:3px solid var(--accent,#a855f7);border-radius:6px;&quot;>' + skGroupLabel(grpObj.name) + ' · ' + grpObj.items.length + ' từ</div>';
      html += '<div class=&quot;sk-verb-grid&quot;>';
      for(var k=0; k<grpObj.items.length; k++){
        var it = grpObj.items[k];
        html += '<div class=&quot;sk-verb-card&quot;>'
          + '<div style=&quot;display:flex;align-items:center;justify-content:space-between;gap:8px;&quot;>'
          +   '<span style=&quot;font-family:Noto Serif JP,serif;font-size:15px;font-weight:700;color:var(--text-main,#f3e8ff);&quot;>' + it.baseHtml + '</span>'
          +   '<button type=&quot;button&quot; data-sk-check=&quot;' + it.id + '&quot; style=&quot;background:var(--accent,#a855f7);border:none;color:#000;font-weight:800;padding:4px 10px;border-radius:8px;font-size:11px;cursor:pointer;&quot;>✓</button>'
          + '</div>'
          + '<div style=&quot;display:flex;align-items:center;gap:6px;flex-wrap:wrap;&quot;>'
          +   '<span style=&quot;font-size:10px;color:var(--text-muted,#9f88be);&quot;>Trợ từ</span>'
          +   '<input id=&quot;verb-particle-' + it.id + '&quot; class=&quot;sk-part-blank&quot; type=&quot;text&quot; autocomplete=&quot;off&quot; placeholder=&quot;?&quot; data-expected=&quot;' + it.particle + '&quot; data-vid=&quot;' + it.id + '&quot;>'
          +   '<input id=&quot;verb-input-' + it.id + '&quot; class=&quot;sk-blank-input&quot; type=&quot;text&quot; autocomplete=&quot;off&quot; placeholder=&quot;' + it.ph + '&quot; data-expected=&quot;' + it.expected + '&quot; data-vid=&quot;' + it.id + '&quot; style=&quot;flex:1;min-width:96px;text-align:left;font-family:Noto Serif JP,serif;&quot;>'
          + '</div>'
          + '<span id=&quot;verb-ans-badge-' + it.id + '&quot; style=&quot;display:none;font-size:0;&quot;>' + it.expected + '</span>'
          + '<div class=&quot;sk-verb-ans&quot; id=&quot;verb-fullans-' + it.id + '&quot; style=&quot;display:none;font-size:11.5px;line-height:1.5;color:var(--text-main,#f3e8ff);background:var(--highlight,#2b1947);border:1px solid var(--border,#581c87);border-radius:8px;padding:6px 9px;&quot;>'
          +   '<strong style=&quot;color:var(--accent,#a855f7);&quot;>Đáp án:</strong> Trợ từ <b style=&quot;color:var(--accent-hover,#c084fc);&quot;>' + (it.particle||'—') + '</b> &nbsp;·&nbsp; Thể sai khiến <b style=&quot;font-family:Noto Serif JP,serif;color:var(--accent-hover,#c084fc);&quot;>' + it.expected + '</b>'
          + '</div>'
          + '</div>';
      }
      html += '</div></div>';
    }

    var grid = document.createElement('div');
    grid.id = 'skVerbGrid';
    grid.innerHTML = html;

    var oldWrap = body.closest ? body.closest('div') : null;
    var tableEl = body.parentElement;
    while(tableEl &amp;&amp; tableEl.tagName !== 'TABLE') tableEl = tableEl.parentElement;
    var scrollWrap = tableEl ? tableEl.parentElement : null;
    if(scrollWrap){ scrollWrap.style.display = 'none'; scrollWrap.parentElement.insertBefore(grid, scrollWrap.nextSibling); }
    else { sec.appendChild(grid); }

    grid.addEventListener('click', function(e){
      var t = e.target;
      while(t &amp;&amp; t !== grid &amp;&amp; !(t.getAttribute &amp;&amp; t.getAttribute('data-sk-check'))) t = t.parentElement;
      if(!t || t === grid) return;
      skCheckVerb(t.getAttribute('data-sk-check'));
    }, false);
    grid.addEventListener('keydown', function(e){
      if(e.key !== 'Enter') return;
      if(e.nativeEvent &amp;&amp; e.nativeEvent.isComposing) return;
      if(e.keyCode === 229) return;
      var t = e.target;
      if(t &amp;&amp; t.getAttribute &amp;&amp; t.getAttribute('data-vid')) skCheckVerb(t.getAttribute('data-vid'));
    }, false);

    _skGridBuilt = true;
    sec.style.display = 'block';

    /* Hien tat ca dap an cung reveal luoi dong tu */
    var origToggle = window.toggleShowAllAnswers;
    window.toggleShowAllAnswers = function(ev){
      if(origToggle){ try{ origToggle(ev); }catch(e){} }
      _skVerbReveal = !_skVerbReveal;
      var cards = grid.querySelectorAll('.sk-verb-card');
      for(var c=0;c<cards.length;c++){
        var pin = cards[c].querySelector('.sk-part-blank');
        var fa = cards[c].querySelector('.sk-verb-ans');
        if(pin){
          if(_skVerbReveal){ pin.value = pin.getAttribute('data-expected')||''; pin.className='sk-part-blank sk-part-ok'; }
          else { pin.value=''; pin.className='sk-part-blank'; }
        }
        if(fa) fa.style.display = _skVerbReveal ? 'block' : 'none';
      }
    };
  }

  function skRunAll(){
    skInjectCss();
    skFullscreen();
    skShowAdvGrammar();
    skLevelTheme();
    skBuildVerbGrid();
  }

  try{ skRunAll(); }catch(e){}
  var n = 0;
  var iv = setInterval(function(){ n++; try{ skRunAll(); }catch(e){} if(n>25) clearInterval(iv); }, 200);
  try{ document.addEventListener('DOMContentLoaded', skRunAll, false); }catch(e){}
  try{ window.addEventListener('load', skRunAll, false); }catch(e){}
})();
</script>

</body>
